<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: black;
      }

      .calculator {
        background: blueviolet;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        text-align: center;
        width: 350px;
      }

      .calculator h2 {
        margin-bottom: 20px;
        color: #333;
      }

      .calculator input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
      }

      .calculator button {
        padding: 10px 18px;
        margin: 10px 5px;
        border: none;
        border-radius: 6px;
        background: #007bff;
        color: white;
        cursor: pointer;
        font-size: 15px;
        transition: 0.3s;
      }

      .calculator button:hover {
        background: #0056b3;
      }

      #result {
        margin-top: 20px;
        color: #222;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <h2>Calculator</h2>

      <input type="number" id="num1" placeholder="Enter first number" />
      <input type="number" id="num2" placeholder="Enter second number" />

      <br /><br />

      <button onclick="add()">ADD</button>
      <button onclick="sub()">SUB</button>
      <button onclick="multi()">MULTI</button>
      <button onclick="divi()">DIV</button>

      <h3 id="result">Result</h3>
    </div>

    <script>
      function add() {
        let a = Number(document.getElementById("num1").value);
        let b = Number(document.getElementById("num2").value);

        document.getElementById("result").innerText = "Result: " + (a + b);
      }

      function sub() {
        let a = Number(document.getElementById("num1").value);
        let b = Number(document.getElementById("num2").value);

        document.getElementById("result").innerText = "Result: " + (a - b);
      }

      function multi() {
        let a = Number(document.getElementById("num1").value);
        let b = Number(document.getElementById("num2").value);

        document.getElementById("result").innerText = "Result: " + a * b;
      }

      function divi() {
        let a = Number(document.getElementById("num1").value);
        let b = Number(document.getElementById("num2").value);

        document.getElementById("result").innerText = "Result: " + a / b;
      }
    </script>
  </body>
</html>
